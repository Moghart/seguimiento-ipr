<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seguimiento IPR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --negro:#0f0f10;--tinta:#1a1a1c;--gris:#6c6c6e;--gris-claro:#e4e4df;--hueso:#f6f5f2;
  --verde:#6bbf3f;--verde-osc:#4e9e2a;--verde-txt:#3b7a1f;--verde-suave:#ebf5e4;
  --ambar:#f0b400;--ambar-txt:#8a6400;--ambar-suave:#fff5d6;--rojo:#d64545;--rojo-txt:#a82e2e;--rojo-suave:#fbeaea;
  --sombra:0 1px 2px rgba(15,15,16,.06),0 4px 16px rgba(15,15,16,.05);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Barlow,"Segoe UI",system-ui,sans-serif;background:var(--hueso);color:var(--tinta);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
.app{display:flex;min-height:100vh}
.side{width:250px;flex:none;background:var(--negro);color:#fff;display:flex;flex-direction:column;gap:6px;padding:22px 14px;position:sticky;top:0;height:100vh}
.brand{padding:4px 10px 18px}.brand .t{font-size:22px;font-weight:600}.brand .t b{color:var(--verde)}
.brand .s{font-size:12.5px;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.08em}
.nav{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:rgba(255,255,255,.75);padding:11px 12px;border-radius:10px;text-align:left;font-weight:500}
.nav:hover{background:rgba(255,255,255,.07);color:#fff}
.nav.on{background:var(--verde);color:var(--negro);font-weight:600}
.nav svg{width:20px;height:20px;flex:none}
.badge{margin-left:auto;background:var(--ambar);color:var(--negro);font-size:12px;font-weight:700;border-radius:20px;padding:1px 8px}
.nav.on .badge{background:var(--negro);color:#fff}
.grow{flex:1}
.me{display:flex;gap:10px;align-items:center;padding:10px;border-top:1px solid rgba(255,255,255,.1);margin-top:6px}
.me b{display:block;font-weight:600;font-size:14px}.me small{color:rgba(255,255,255,.55)}
.side .btn{width:100%;justify-content:flex-start;background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.08);color:#fff;font-weight:500}
.side .btn:hover{background:rgba(255,255,255,.12)}
.main{flex:1;min-width:0;padding:30px 36px 60px;max-width:1400px}
svg{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.eyebrow{font-size:12.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--verde-txt);font-weight:600}
.top h1{font-size:30px;margin-top:2px}.top .sub{color:var(--gris);margin-top:4px;max-width:760px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--gris-claro);background:#fff;color:var(--tinta);padding:9px 16px;border-radius:10px;font-weight:600;font-size:14.5px;transition:background .15s}
.btn:hover{background:#fafaf8}.btn:disabled{opacity:.55;cursor:default}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--verde);border-color:var(--verde);color:var(--negro)}
.btn.primary:hover{background:var(--verde-osc);border-color:var(--verde-osc);color:#fff}
.btn.dark{background:var(--tinta);border-color:var(--tinta);color:#fff}
.btn.ghost{border-color:transparent;background:none}.btn.ghost:hover{background:rgba(15,15,16,.05)}
.btn.danger{color:var(--rojo-txt);border-color:#f0c9c9}
.btn.sm{padding:6px 11px;font-size:13.5px;border-radius:8px}
.btn.big{width:100%;justify-content:center;padding:13px;font-size:16px}
.icon-btn{border:0;background:none;color:var(--gris);padding:6px;border-radius:8px;display:inline-flex;align-items:center;gap:3px}
.icon-btn:hover{background:rgba(15,15,16,.06);color:var(--tinta)}.icon-btn svg{width:18px;height:18px}
.has-ev{color:var(--verde-txt)!important}
.card{background:#fff;border-radius:14px;box-shadow:var(--sombra);padding:22px}
.card h3{font-size:18px;margin-bottom:14px;display:flex;align-items:baseline;gap:10px}.card h3 small{font-weight:500;color:var(--gris);font-size:13.5px}
.mt{margin-top:20px}
.grid{display:grid;gap:16px}.g-3{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}.g-2{grid-template-columns:1.3fr 1fr}
.hero{background:var(--negro);color:#fff;border-radius:18px;padding:28px 32px;display:flex;gap:30px;align-items:center;margin-bottom:20px}
.hero h2{font-size:30px;margin:4px 0}.hero p{margin:0;color:rgba(255,255,255,.7)}
.hero .eyebrow{color:var(--verde)}
.kpi{display:flex;gap:16px;align-items:center;background:#fff;border:0;border-radius:14px;box-shadow:var(--sombra);padding:18px;text-align:left;transition:transform .15s}
.kpi:hover{transform:translateY(-2px)}
.kpi .kt{font-weight:700;font-size:16px}.kpi .ks{color:var(--gris);font-size:13.5px;margin-bottom:8px}.kpi>div{flex:1;min-width:0}
.track{height:7px;background:#efeee9;border-radius:9px;overflow:hidden}.track i{display:block;height:100%;border-radius:9px}
.f-ok{background:var(--verde)}.f-mid{background:var(--ambar)}.f-bad{background:var(--rojo)}.f-na{background:transparent}
.pill{display:inline-block;font-weight:700;font-size:13px;padding:2px 10px;border-radius:20px;white-space:nowrap}
.pill.ok{background:var(--verde-suave);color:var(--verde-txt)}.pill.mid{background:var(--ambar-suave);color:var(--ambar-txt)}.pill.bad{background:var(--rojo-suave);color:var(--rojo-txt)}.pill.na{background:#f0f0ec;color:var(--gris)}
.av{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--tinta);color:#fff;font-size:11.5px;font-weight:700;flex:none}
.av.big-av{width:40px;height:40px;font-size:14px}
.me .av{background:var(--verde);color:var(--negro)}
.who{display:inline-flex;align-items:center;gap:7px}
.prow{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:10px;border-radius:10px;text-align:left}
.prow:hover{background:var(--hueso)}.prow .pn{flex:1;min-width:0;font-weight:600}.prow small{display:block;color:var(--gris);font-weight:400}
.plist{display:flex;flex-direction:column;gap:4px}
.prow-pend{display:flex;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid #f0efea}.prow-pend:last-child{border:0}
.prow-pend p{margin:0;flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--gris-claro);background:#fff;border-radius:20px;padding:6px 14px;font-size:14px;font-weight:500}
.chip.on{background:var(--tinta);border-color:var(--tinta);color:#fff}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--gris-claro);background:#fff;border-radius:10px;padding:0 10px;flex:1;min-width:220px}
.search svg{width:18px;height:18px;color:var(--gris)}.search input{border:0;flex:1;padding:8px 0;outline:none;background:none}
.section{margin-top:22px}
.shead{display:flex;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap}.shead h2{font-size:19px}.shead .count{color:var(--gris);font-size:14px}.shead .track{width:140px}
.item{display:grid;grid-template-columns:54px 1fr auto;gap:16px;background:#fff;border-radius:12px;box-shadow:var(--sombra);padding:16px 18px;margin-bottom:8px;border-left:5px solid var(--gris-claro)}
.item.ok{border-left-color:var(--verde)}.item.mid{border-left-color:var(--ambar)}.item.bad{border-left-color:var(--rojo)}
.item .code{font-weight:700;color:var(--gris);font-size:14px}.item .q{margin:0 0 6px;font-weight:500}
.meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--gris);font-size:13px;align-items:center}
.tag{background:var(--hueso);border-radius:6px;padding:1px 8px}
.note{margin-top:8px;background:var(--hueso);border-radius:8px;padding:8px 12px;font-size:13.5px;white-space:pre-wrap}
.ctrl{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.seg{display:inline-flex;background:#f1f0ec;border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--gris);white-space:nowrap}
.seg button:hover{background:#fff}
.seg .bad.on{background:var(--rojo);color:#fff}.seg .mid.on{background:var(--ambar);color:var(--negro)}.seg .ok.on{background:var(--verde);color:var(--negro)}
.custom{font-size:12px;color:var(--gris)}
.rfgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.rf{background:#fff;border-radius:14px;box-shadow:var(--sombra);padding:16px 18px;border-top:5px solid var(--gris-claro);display:flex;flex-direction:column;gap:8px}
.rf.ok{border-top-color:var(--verde)}.rf.mid{border-top-color:var(--ambar)}.rf.bad{border-top-color:var(--rojo)}
.rf .rh{display:flex;justify-content:space-between;align-items:center}.rf .rc{font-weight:700;color:var(--gris)}.rf .rp{font-weight:700;font-size:22px}
.t-ok{color:var(--verde-txt)}.t-mid{color:var(--ambar-txt)}.t-bad{color:var(--rojo-txt)}.t-na{color:var(--gris)}
.rf h4{font-size:16px}.rf .rdue{color:var(--gris);font-size:13px}
.rf input[type=range]{width:100%;accent-color:var(--verde-osc)}
.rfoot{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--gris)}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-bottom:18px}
.person{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid transparent;border-radius:14px;box-shadow:var(--sombra);padding:12px 14px;text-align:left}
.person.on{border-color:var(--verde)}.person .pn{font-weight:700}.person .pd{color:var(--gris);font-size:13px}
.turnhead{display:flex;align-items:center;gap:18px;margin-bottom:16px;flex-wrap:wrap}.turnhead h2{font-size:22px}.turnhead .sp{flex:1}
.act{display:grid;grid-template-columns:36px 1fr auto;gap:14px;align-items:start;padding:14px 0;border-top:1px solid #f0efea}
.act .num{width:30px;height:30px;border-radius:50%;background:#f1f0ec;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.act.ok .num{background:var(--verde);color:var(--negro)}.act .num svg{width:16px;height:16px}
.tchip{display:inline-block;background:var(--tinta);color:#fff;border-radius:6px;font-size:11.5px;font-weight:700;padding:1px 7px;margin-right:8px;vertical-align:1px}
.obs{width:100%;margin-top:8px;border:1px solid var(--gris-claro);border-radius:8px;padding:7px 10px;font-size:14px}
.ar{display:flex;align-items:center;gap:4px}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th{text-align:left;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--gris);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--gris-claro)}
.tb td{padding:10px;border-bottom:1px solid #f0efea;vertical-align:middle}
.tablewrap{overflow-x:auto}
.empty{text-align:center;color:var(--gris);padding:40px}
.ov{position:fixed;inset:0;background:rgba(15,15,16,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:16px;width:min(620px,100%);max-height:92vh;overflow-y:auto;padding:24px 26px;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.modal h3{margin:0 0 6px;font-size:21px}.modal .intro{color:var(--gris);margin:0 0 16px}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;flex:1;min-width:0}
.fld label{font-weight:600;font-size:14px}
.fld input,.fld select,.fld textarea{border:1px solid var(--gris-claro);border-radius:9px;padding:10px 12px;background:#fff;width:100%}
.fld textarea{min-height:84px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus,.obs:focus{outline:2px solid var(--verde);border-color:var(--verde)}
.frow{display:flex;gap:12px}
.err{color:var(--rojo-txt);font-size:13px}
.mact{display:flex;justify-content:space-between;gap:10px;margin-top:8px;flex-wrap:wrap}.mact span{display:flex;gap:8px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:12px 18px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;z-index:60;max-width:calc(100% - 32px)}
.toast i{width:10px;height:10px;border-radius:50%;background:var(--verde);flex:none}.toast.bad i{background:var(--rojo)}
.secret{font-family:Consolas,monospace;font-size:22px;letter-spacing:.08em;background:var(--hueso);padding:12px 16px;border-radius:10px;text-align:center;font-weight:700;user-select:all;word-break:break-all}
.evlist{list-style:none;margin:4px 0 14px;padding:0;display:flex;flex-direction:column;gap:8px}
.evlist li{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--gris-claro);border-radius:12px}
.evic{display:inline-flex;width:34px;height:34px;border-radius:9px;background:var(--verde-suave);align-items:center;justify-content:center;flex:none;color:var(--verde-txt)}.evic svg{width:18px;height:18px}
.evn{flex:1;min-width:0}.evn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.evn small{color:var(--gris);font-size:12.5px}
.preview img{max-width:100%;border-radius:10px;margin-bottom:10px}
.loading{display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--gris);gap:12px;font-size:16px}
.spin{width:22px;height:22px;border:3px solid var(--gris-claro);border-top-color:var(--verde);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--negro)}
.lcard{background:#fff;border-radius:18px;padding:34px 32px;width:min(410px,100%)}
.lcard .brand{padding:0 0 22px}.lcard .brand .t{color:var(--tinta)}.lcard .brand .s{color:var(--gris)}
.lcard h1{font-size:24px;margin-bottom:16px}
.lmsg{background:var(--ambar-suave);color:var(--ambar-txt);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:14px}
.lfoot{color:var(--gris);font-size:13px;margin:16px 0 0;text-align:center}
.side .btn[data-tool="instalar"]{display:none}
.itabs{display:flex;gap:6px;overflow-x:auto;margin:16px 0 12px;padding-bottom:4px}
.itabs button{flex:none;border:1px solid var(--gris-claro);background:#fff;border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;white-space:nowrap;color:var(--tinta)}
.itabs button.on{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.lnkchip{display:inline-block;margin-top:6px;border:0;background:var(--verde-suave);color:var(--verde-txt);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600}
.iturno{display:flex;align-items:center;gap:8px}.iturno>span{font-size:12.5px;color:var(--gris);font-weight:600;min-width:52px;text-align:right}
.note{color:var(--gris);font-size:12.5px;margin-top:4px}
.igrid input.inum{width:64px;border:1px solid var(--gris-claro);border-radius:8px;padding:6px 8px;text-align:center}
.igrid th{white-space:nowrap}
.irow{display:grid;grid-template-columns:130px 1fr 110px 90px;gap:10px;align-items:start;padding:12px 0;border-top:1px solid #f0efea}
.irow .ilab{font-weight:700;padding-top:28px}
.irec{border:1px solid var(--gris-claro);border-radius:12px;padding:14px;margin-bottom:12px}
.irech{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.igrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}.igrid2 .wide{grid-column:1/-1}
.ifotos{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn.has-ev{border-color:var(--verde);color:var(--verde-txt)}
.idias{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.iday{border:1px solid var(--gris-claro);background:#fff;border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font:inherit;color:var(--tinta)}
.iday span{font-size:12.5px;color:var(--gris);font-weight:600}.iday b{font-size:22px;line-height:1.1}.iday small{font-size:11.5px;color:var(--gris)}
.iday.lleno{border-color:var(--verde);background:var(--verde-suave)}.iday.lleno small{color:var(--verde-txt);font-weight:600}
.iday.hoy{outline:2px solid var(--tinta);outline-offset:1px}
.imenu{display:flex;flex-wrap:wrap;gap:8px}
.iav-dos{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.iav-card{background:#fff;border-radius:18px;box-shadow:var(--sombra);overflow:hidden}
.iav-hero{background:var(--negro);color:#fff;display:flex;align-items:center;gap:18px;padding:20px 22px;background-image:radial-gradient(circle at 100% 0,rgba(110,190,68,.25),transparent 55%)}
.iav-ht{min-width:0}.iav-ht .eyebrow{color:var(--verde)}.iav-ht h3{color:#fff;font-size:21px;margin:2px 0 8px}
.iav-est{display:inline-block;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600}.iav-est.ok{background:rgba(110,190,68,.2);color:#a9e48a}.iav-est.mid{background:rgba(240,180,0,.2);color:#ffd36b}
.iav-kpis{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid #eeede8}
.iav-kpi{padding:14px 16px;border-right:1px solid #eeede8}.iav-kpi:last-child{border-right:0}
.iav-kn{font-size:26px;font-weight:800;line-height:1}.iav-kn span{font-size:15px;color:var(--gris);font-weight:600}.iav-kl{font-size:12px;color:var(--gris);margin:4px 0 8px;font-weight:600}
.iav-kt,.iav-track{height:6px;border-radius:99px;background:#eeede8;overflow:hidden}.iav-kt i,.iav-track i{display:block;height:100%;border-radius:99px;background:#d9d6cc}
.iav-kt i.ok,.iav-track i.ok{background:var(--verde)}.iav-kt i.mid,.iav-track i.mid{background:#e8b03a}.iav-kt i.low,.iav-track i.low{background:#e07a5f}
.iav-sec{padding:16px 20px 4px}.iav-sec:last-child{padding-bottom:20px}
.iav-h{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--tinta);font-weight:800;margin-bottom:10px}.iav-h small{text-transform:none;letter-spacing:0;color:var(--gris);font-weight:500;margin-left:6px}
.iav-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.iav-day{border:1px solid #e7e5de;background:#fbfaf7;border-radius:12px;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font:inherit;color:var(--tinta)}
.iav-day .d1{font-size:11px;color:var(--gris);font-weight:700;text-transform:uppercase}.iav-day b{font-size:18px;line-height:1.1}.iav-day .d2{font-size:10.5px;color:var(--gris);font-weight:600}
.iav-day .dots{display:flex;gap:3px;margin:3px 0}.iav-day .dots i{width:7px;height:7px;border-radius:50%;background:#dedbd2}.iav-day .dots i.ok{background:var(--verde)}.iav-day .dots i.no{background:#e07a5f}
.iav-day.ok{background:var(--verde-suave);border-color:#cfe9c0}.iav-day.ok .d2{color:var(--verde-txt)}
.iav-day.mid{background:#fff8e6;border-color:#f3dfa6}.iav-day.mid .d2{color:var(--ambar-txt)}
.iav-day.no{background:var(--rojo-suave);border-color:#f1cfcf}.iav-day.no .d2{color:var(--rojo-txt)}
.iav-day.fut{opacity:.55}.iav-day.hoy{box-shadow:0 0 0 2px var(--tinta)}
.iav-leg{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--gris);margin:8px 0 6px}

const MAX_MB = 10;
function leerB64(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1] || ""); r.onerror = () => rej(new Error("No se pudo leer el archivo.")); r.readAsDataURL(file); }); }
async function descargar(id, previewEl) {

    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);

    if (previewEl && /^image\//.test(f.mime)) { previewEl.innerHTML = `<img src="${url}" alt="${esc(f.nombre)}">`; $$(".toast").forEach(t => t.remove()); return; }
    const a = document.createElement("a"); a.href = url; a.download = f.nombre; document.body.append(a); a.click(); a.remove();

  } catch (e) { fallo(e); }
}
async function bajarVarios(lista, nombreZip) {
  if (!lista.length) return toast("No hay archivos para descargar.", true);
  if (lista.length === 1) return descargar(lista[0].id);
  toast(`Preparando ${lista.length} archivos…`);
  try {
    const f = await T("bajarZip", lista, nombreZip), bin = atob(f.b64), u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([u8], { type: f.mime }));
    const a = document.createElement("a"); a.href = url; a.download = f.nombre; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000); toast(`${lista.length} archivos descargados en un ZIP.`);

}

/* Cuadro para firmar con el dedo o el mouse; devuelve PNG chico en data URL */
function padFirma(titulo, intro) {
  return new Promise(resolve => {
    const ov = document.createElement("div"); ov.className = "ov";
    ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(titulo)}"><h3>${esc(titulo)}</h3><p class="intro">${intro}</p>
      <canvas class="hpad" width="600" height="200"></canvas><div class="mact"><button type="button" class="btn ghost" data-borrar>Borrar</button><span><button type="button" class="btn ghost" data-x>Cancelar</button><button type="button" class="btn primary" data-ok>Guardar firma</button></span></div></div>`;
    document.body.append(ov);
    const pad = iniciarPad($("canvas", ov)), close = v => { ov.remove(); resolve(v); };
    $("[data-x]", ov).onclick = () => close(null); $("[data-borrar]", ov).onclick = () => pad.borrar();
    $("[data-ok]", ov).onclick = () => { if (pad.vacio()) return toast("Firma dentro del recuadro.", true); close(pad.png()); };
  });
}
function iniciarPad(c) {
  const g = c.getContext("2d"); let dib = false, n = 0, last = null;
  const pos = e => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height]; };
  g.lineWidth = 4; g.lineCap = g.lineJoin = "round"; g.strokeStyle = "#111";
  c.style.touchAction = "none";
  c.addEventListener("pointerdown", e => { dib = true; last = pos(e); c.setPointerCapture(e.pointerId); g.beginPath(); g.arc(last[0], last[1], 1.5, 0, 7); g.fillStyle = "#111"; g.fill(); n++; });
  c.addEventListener("pointermove", e => { if (!dib) return; const p = pos(e); g.beginPath(); g.moveTo(last[0], last[1]); g.lineTo(p[0], p[1]); g.stroke(); last = p; n++; });
  ["pointerup", "pointercancel", "pointerleave"].forEach(t => c.addEventListener(t, () => { dib = false; }));
  return {
    vacio: () => n < 8,
    borrar: () => { g.clearRect(0, 0, c.width, c.height); n = 0; },
    png: () => { const o = document.createElement("canvas"); o.width = 300; o.height = 100; o.getContext("2d").drawImage(c, 0, 0, 300, 100); return o.toDataURL("image/png"); }
  };
}

    <p class="intro" style="margin:0 0 8px"><b>${link}</b></p>` + pasos +
    `<p class="intro" style="margin-top:8px">Quedará el ícono verde de Seguimiento IPR en tu pantalla de inicio.</p>`;
  return infoBox("Instalar en el celular", html);
}
function avisoInstalar() {
  try { if (!ES_CEL || yaInstalada() || localStorage.getItem("ipr-noinst") || sessionStorage.getItem("ipr-noinst-hoy")) return; } catch (_) { if (!ES_CEL) return; }
  if (document.querySelector(".instbar")) return;
  const b = document.createElement("div"); b.className = "instbar"; b.setAttribute("role", "dialog"); b.setAttribute("aria-label", "Instalar app");
  b.innerHTML = `<b>Instala la app en tu celular</b><p>Deja Seguimiento IPR como ícono en tu pantalla de inicio para abrirla rápido.</p>
    <div class="ib"><button class="pri" data-i="como">Cómo instalar</button><button data-i="luego">Ahora no</button><button class="lnk" data-i="nunca">No volver a mostrar</button></div>`;
  b.onclick = e => { const x = e.target.closest("[data-i]"); if (!x) return; const k = x.dataset.i;
    if (k === "como") instalarAyuda();
    if (k === "luego") { try { sessionStorage.setItem("ipr-noinst-hoy", "1"); } catch (_) {} }
    if (k === "nunca") { try { localStorage.setItem("ipr-noinst", "1"); } catch (_) {} toast("Listo, no volverá a aparecer. Puedes usar el botón Instalar app cuando quieras."); }
    b.remove(); };
  document.body.append(b);
}

/* ===================== Inicio ===================== */
(function init() {
  try { S.token = localStorage.getItem("ipr-token"); } catch (_) {}
  if (S.token) cargar().catch(() => pantallaLogin()); else pantallaLogin();
  setTimeout(avisoInstalar, 1200);
  if (EN_INSTALADOR) document.documentElement.classList.add("en-inst");
})();
</script>
